name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build the jar
        run: gradle build

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: elementalarms-jar
          path: build/libs/*.jar
